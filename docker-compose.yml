services:
  api:
    build:
      context: .
      target: run
      args:
        VERSION_PREFIX: 1.0.0.0
        VERSION_SUFFIX: docker
    ports:
      - "8740:8080"
    environment:
      DOTNET_ENVIRONMENT: docker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    volumes:
      - movie-reviews-data:/app/data
    networks:
      - cleanwebapi_network
    depends_on:
      - otel-collector
  otel-collector:
    image: otel/opentelemetry-collector:0.164.0
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "8743:4317"
      - "8744:4318"
    networks:
      - cleanwebapi_network
    depends_on:
      - aspire-dashboard
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6.2
    ports:
      - "8742:18888"
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    networks:
      - cleanwebapi_network
volumes:
  movie-reviews-data:
networks:
  cleanwebapi_network:
    driver: bridge
